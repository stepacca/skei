    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var fetchProp = {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          };

          try {
            Object.defineProperty(window, 'fetch', fetchProp);
          } catch (_) {}

          try {
            if (window.Window && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', fetchProp);
            }
          } catch (_) {}
        } catch (e) {}

        try {
          window.addEventListener('error', function(event) {
            var isExt = (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1);
            var isFetchErr = (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1);
            if (isExt || isFetchErr) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var stack = (reason && reason.stack) || '';
            var msg = (reason && reason.message) || '';
            if (stack.indexOf('chrome-extension://') !== -1 || (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1)) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
            }
          }, true);
        } catch (e) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skei_theme_v1');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && systemDark) || (saved === 'system' && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#09090b';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#fafafa';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
